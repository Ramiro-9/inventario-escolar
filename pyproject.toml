[project]
name = "inventario-escolar"
version = "3.0.0"
description = "API de inventario escolar con FastAPI y PostgreSQL"
requires-python = ">=3.11,<4"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.1",
    "psycopg2-binary==2.9.13",
    "python-dotenv==1.2.3",
    "openpyxl==3.1.5",
    "reportlab==5.0.1",
    "python-jose[cryptography]==3.5.0",
    "bcrypt==5.0.0",
    "python-multipart==0.0.32",
    "pydantic==2.13.5",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
]

[tool.uv]
package = false
